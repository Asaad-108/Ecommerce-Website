<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <title>Ecommerce</title>
  </head>
  <body>
    <header>
      <div class="head">
        <div>Welcome to Worldwide MegaMart</div>
        <div class="top-analytics">
          <div class="box">
            <img src="../assets/map-pin.svg" alt="" />
            <div>Deliver to Location</div>
          </div>
          <div class="box">
            <img src="../assets/van.svg" alt="" />
            <div>Track Your Orders</div>
          </div>
          <div class="box">
            <img src="../assets/badge-dollar-sign.svg" alt="" />
            <div>All offers</div>
          </div>
        </div>
      </div>
      <nav>
        <div class="box">
          <img src="../assets/menu.svg" alt="" />
          <div style="font-size: x-large; color: #008ecc">MegaMart</div>
        </div>
        <div class="top-analytics box2">
          <div class="box input-feild">
            <img src="../assets/search.svg" alt="" />
            <input
              type="text"
              placeholder="search essentials groceries and more ..."
            />
          </div>
          <div class="box">
            <img src="../assets/user.svg" alt="" />
            <div>Sign Up/Sign In</div>
          </div>
          <div class="box">
            <img src="../assets/shopping-cart.svg" alt="" />
            <div>Cart</div>
          </div>
        </div>
      </nav>
      <div class="section1">
        <div class="bullets box">
          <div>Groceries</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Premium fruits</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Home & Kitchen</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Fashion</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Electronic</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Beauty</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Home Improvement</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
        <div class="bullets box">
          <div>Sports & Toys</div>
          <img src="../assets/chevron-down.svg" alt="" />
        </div>
      </div>
    </header>
  </body>
</html>
